name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#docker
      - run: docker load < result
      - run: docker tag ghcr.io/miniharinn/hydra-banner:latest ghcr.io/miniharinn/hydra-banner:${{ github.ref_name }}
      - run: docker push ghcr.io/miniharinn/hydra-banner:latest
      - run: docker push ghcr.io/miniharinn/hydra-banner:${{ github.ref_name }}
